<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>QS Wallet · History</title>
</head>
<body>

  <main class="history-page">
    <div class="cal-header">
      <button class="cal-month-label" id="monthLabel">Month Year</button>
    </div>
    <p class="cal-swipe-hint">Swipe left or right to change month</p>

    <div class="cal-weekdays">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div id="historySummary">
      <div class="divider"></div>
      <h2 class="section-title" id="summaryTitle">Month summary</h2>
      <ul class="grouped-list" id="monthSummaryTotals"></ul>
      <p class="cal-swipe-hint">Swipe left or right to switch pages</p>
    </div>
  </main>

  <!-- MONTH / YEAR PICKER -->
  <div class="sheet-overlay" id="monthPickerOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span>Jump to month</span>
        <button class="sheet-close" id="monthPickerClose">Close</button>
      </div>
      <div class="sheet-body">
        <label class="field-label">Year</label>
        <div class="pill-row" id="yearPills"></div>
        <label class="field-label">Month</label>
        <div class="pill-row" id="monthPills"></div>
      </div>
    </div>
  </div>

  <!-- DAY DETAIL (list of that day's transactions) -->
  <div class="sheet-overlay" id="dayOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span id="dayTitle">Date</span>
        <button class="sheet-close" id="dayClose">Close</button>
      </div>
      <div class="sheet-body">
        <ul class="grouped-list" id="dayList"></ul>
      </div>
    </div>
  </div>

  <!-- TRANSACTION DETAIL / EDIT SHEET -->
  <div class="sheet-overlay" id="detailOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span>Transaction</span>
        <button class="sheet-close" id="detailClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="detail-header">
          <span class="tile-mini" id="detailIconWrap" style="width:40px;height:40px;border-radius:12px;font-size:20px;"><span id="detailIcon"></span></span>
          <span class="detail-amount" id="detailAmount"></span>
        </div>
        <div class="detail-rows">
          <div class="detail-row"><span class="k">Category</span><span class="v" id="detailCategory"></span></div>
          <div class="detail-row"><span class="k">Account</span><span class="v" id="detailAccount"></span></div>
          <div class="detail-row"><span class="k">Date</span><span class="v" id="detailDate"></span></div>
          <div class="detail-row"><span class="k">Time of day</span><span class="v" id="detailPeriod"></span></div>
          <div class="detail-row hidden" id="detailNoteRow"><span class="k">Note</span><span class="v" id="detailNote"></span></div>
        </div>

        <div class="amount-row hidden" id="detailEditRow">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="detailEditAmount" />
        </div>
        <div class="hidden" id="detailEditDateWrap">
          <label class="field-label">Date</label>
          <input type="date" class="date-input" id="detailEditDate" />
        </div>
        <div class="hidden" id="detailEditNoteWrap">
          <label class="field-label">Note</label>
          <input type="text" class="text-input" id="detailEditNote" placeholder="Add a note" />
        </div>

        <button class="btn-confirm hidden" id="detailSaveEdit">Save changes</button>
        <button class="btn-secondary" id="detailEditToggle" style="color:var(--blue); background:var(--bg-elevated-2);">Edit details</button>
        <button class="btn-secondary" id="detailDelete">Delete this transaction</button>
      </div>
    </div>
  </div>

  <script type="module" src="history.js"></script>

  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <a href="index.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Home</span>
      </a>
      <a href="history.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>History</span>
      </a>
      <a href="analytics.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Analytics</span>
      </a>
      <a href="debts.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h13M7 8l4-4M7 8l4 4"/><path d="M17 16H4M17 16l-4-4M17 16l4 4"/></svg>
        <span>Debts</span>
      </a>
      <a href="settings.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
</body>
</html>
