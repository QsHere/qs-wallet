<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>QS Wallet · History</title>
</head>
<body>

  <header class="topbar">
    <span class="page-title">History</span>
  </header>

  <main class="history-page">
    <div id="historyList"></div>
  </main>

  <!-- TRANSACTION DETAIL SHEET -->
  <div class="sheet-overlay" id="editOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span>Transaction</span>
        <button class="sheet-close" id="editClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="detail-header">
          <span class="tile-mini" id="detailIconWrap" style="width:40px;height:40px;border-radius:12px;font-size:20px;"><span id="detailIcon"></span></span>
          <span class="detail-amount" id="detailAmountLabel"></span>
        </div>
        <div class="detail-rows">
          <div class="detail-row"><span class="k">Category</span><span class="v" id="detailCategory"></span></div>
          <div class="detail-row"><span class="k">Account</span><span class="v" id="detailAccount"></span></div>
          <div class="detail-row"><span class="k">Time of day</span><span class="v" id="detailPeriod"></span></div>
          <div class="detail-row hidden" id="detailNoteRow"><span class="k">Note</span><span class="v" id="detailNote"></span></div>
        </div>

        <div class="amount-row" id="editAmountRow">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="editAmount" />
        </div>
        <label class="field-label">Date</label>
        <input type="date" class="date-input" id="editDate" />

        <button class="btn-confirm" id="saveEdit">Save changes</button>
        <button class="btn-secondary" id="deleteEntry">Delete this transaction</button>
      </div>
    </div>
  </div>

  <script type="module" src="history.js"></script>

  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <a href="index.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Home</span>
      </a>
      <a href="history.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>History</span>
      </a>
      <a href="analytics.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Analytics</span>
      </a>
      <a href="debts.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h13M7 8l4-4M7 8l4 4"/><path d="M17 16H4M17 16l-4-4M17 16l4 4"/></svg>
        <span>Debts</span>
      </a>
      <a href="settings.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Categories</span>
      </a>
    </nav>
  </div>
</body>
</html>
