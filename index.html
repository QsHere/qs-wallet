<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>QS Wallet</title>
</head>
<body>

  <header class="topbar">
    <span class="page-title">QS Wallet</span>
  </header>

  <main class="dashboard">
    <section class="hero">
      <p class="hero-label">
        Available to spend
        <button class="eye-btn" id="toggleVisibility" title="Show/hide">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </p>
      <p class="hero-number" id="availableAmount">RM —</p>
      <p class="hero-caption" id="todayDate">—</p>
    </section>

    <button class="collapse-toggle" id="toggleAccounts">
      <span>Accounts &amp; Debts</span>
      <svg class="collapse-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="collapse-content" id="accountsCollapse">
      <div>
        <section class="balances" id="balances"></section>
        <section class="debts-summary" id="debtsSummary"></section>
      </div>
    </div>

    <section class="actions">
      <button class="btn btn-spend" id="openSpend"><span>–</span> Spend</button>
      <button class="btn btn-income" id="openIncome"><span>+</span> Income</button>
    </section>

    <section class="recent">
      <h2 class="recent-title"><span>Recent</span> <a href="history.html">See all</a></h2>
      <ul class="recent-list" id="recentList"></ul>
    </section>
  </main>

  <!-- BOTTOM TAB BAR -->
  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <a href="index.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Home</span>
      </a>
      <a href="history.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>History</span>
      </a>
      <a href="analytics.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Analytics</span>
      </a>
      <a href="debts.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h13M7 8l4-4M7 8l4 4"/><path d="M17 16H4M17 16l-4-4M17 16l4 4"/></svg>
        <span>Debts</span>
      </a>
      <a href="settings.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Categories</span>
      </a>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

  <!-- SPEND FLOW MODAL -->
  <div class="sheet-overlay" id="spendOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button class="sheet-back" id="spendBack" style="visibility:hidden;">Back</button>
        <span id="spendStepTitle">Pick a category</span>
        <button class="sheet-close" id="spendClose">Close</button>
      </div>

      <div class="sheet-body" id="spendCategoryStep">
        <div class="category-grid" id="categoryGrid"></div>
      </div>

      <div class="sheet-body hidden" id="spendAmountStep">
        <p class="amount-context"><span class="tile-mini" id="chosenCategoryIconWrap"><span id="chosenCategoryIcon"></span></span> <span id="chosenCategoryLabel"></span></p>

        <div class="amount-row" id="spendAmountRow">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="spendAmount" placeholder="0.00" />
        </div>

        <label class="field-label">From</label>
        <div class="pill-row" id="spendAccountPills"></div>

        <label class="field-label">Date</label>
        <div class="pill-row" id="spendDatePills">
          <button type="button" class="pill" data-date="today">Today</button>
          <button type="button" class="pill" data-date="yesterday">Yesterday</button>
          <button type="button" class="pill" data-date="other">Other…</button>
        </div>
        <div class="date-input-wrap hidden" id="spendDateWrap">
          <input type="date" class="date-input" id="spendDate" />
        </div>

        <label class="field-label">Time of day</label>
        <div class="pill-row" id="spendPeriodPills">
          <button type="button" class="pill" data-period="morning"><span class="pill-icon">🌅</span> Morning</button>
          <button type="button" class="pill" data-period="noon"><span class="pill-icon">☀️</span> Noon</button>
          <button type="button" class="pill" data-period="night"><span class="pill-icon">🌙</span> Night</button>
          <button type="button" class="pill" data-period="midnight"><span class="pill-icon">🌑</span> Midnight</button>
        </div>

        <label class="field-label">Note (optional)</label>
        <input type="text" id="spendNote" class="text-input" placeholder="Add a note" />

        <button class="btn-confirm" id="confirmSpend">Confirm</button>
      </div>
    </div>
  </div>

  <!-- INCOME FLOW MODAL -->
  <div class="sheet-overlay" id="incomeOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span>Add income</span>
        <button class="sheet-close" id="incomeClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="amount-row" id="incomeAmountRow">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="incomeAmount" placeholder="0.00" />
        </div>

        <label class="field-label">To</label>
        <div class="pill-row" id="incomeAccountPills"></div>

        <label class="field-label">Source (optional)</label>
        <input type="text" id="incomeSource" class="text-input" placeholder="e.g. Father's business, Salary" />

        <label class="field-label">Date</label>
        <div class="pill-row" id="incomeDatePills">
          <button type="button" class="pill" data-date="today">Today</button>
          <button type="button" class="pill" data-date="yesterday">Yesterday</button>
          <button type="button" class="pill" data-date="other">Other…</button>
        </div>
        <div class="date-input-wrap hidden" id="incomeDateWrap">
          <input type="date" class="date-input" id="incomeDate" />
        </div>

        <label class="field-label">Time of day</label>
        <div class="pill-row" id="incomePeriodPills">
          <button type="button" class="pill" data-period="morning"><span class="pill-icon">🌅</span> Morning</button>
          <button type="button" class="pill" data-period="noon"><span class="pill-icon">☀️</span> Noon</button>
          <button type="button" class="pill" data-period="night"><span class="pill-icon">🌙</span> Night</button>
          <button type="button" class="pill" data-period="midnight"><span class="pill-icon">🌑</span> Midnight</button>
        </div>

        <button class="btn-confirm" id="confirmIncome">Confirm</button>
      </div>
    </div>
  </div>

  <!-- TRANSACTION DETAIL SHEET -->
  <div class="sheet-overlay" id="detailOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span>Transaction</span>
        <button class="sheet-close" id="detailClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="detail-header">
          <span class="tile-mini" id="detailIconWrap" style="width:40px;height:40px;border-radius:12px;font-size:20px;"><span id="detailIcon"></span></span>
          <span class="detail-amount" id="detailAmount"></span>
        </div>
        <div class="detail-rows">
          <div class="detail-row"><span class="k">Category</span><span class="v" id="detailCategory"></span></div>
          <div class="detail-row"><span class="k">Account</span><span class="v" id="detailAccount"></span></div>
          <div class="detail-row"><span class="k">Date</span><span class="v" id="detailDate"></span></div>
          <div class="detail-row"><span class="k">Time of day</span><span class="v" id="detailPeriod"></span></div>
          <div class="detail-row hidden" id="detailNoteRow"><span class="k">Note</span><span class="v" id="detailNote"></span></div>
        </div>

        <div class="amount-row hidden" id="detailEditRow">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="detailEditAmount" />
        </div>
        <div class="hidden" id="detailEditDateWrap">
          <label class="field-label">Date</label>
          <input type="date" class="date-input" id="detailEditDate" />
        </div>

        <button class="btn-confirm hidden" id="detailSaveEdit">Save changes</button>
        <button class="btn-secondary" id="detailEditToggle" style="color:var(--blue); background:var(--bg-elevated-2);">Edit amount or date</button>
        <button class="btn-secondary" id="detailDelete">Delete this transaction</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
