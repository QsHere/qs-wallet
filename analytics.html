<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1B2E2B" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<title>QS Wallet · Analytics</title>
</head>
<body>

  <header class="topbar">
    <a href="index.html" class="nav-back">‹ Back</a>
    <span class="wordmark">Spending breakdown</span>
    <span class="topnav-spacer"></span>
  </header>

  <main class="analytics-page">
    <div class="period-toggle">
      <button class="toggle-btn active" id="btnWeek">This week</button>
      <button class="toggle-btn" id="btnMonth">This month</button>
    </div>

    <p class="analytics-total" id="totalAmount">RM —</p>
    <p class="analytics-total-label">Total spent</p>

    <div class="chart-wrap">
      <canvas id="pieChart" width="280" height="280"></canvas>
    </div>

    <ul class="legend-list" id="legendList"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="analytics.js"></script>
</body>
</html>
