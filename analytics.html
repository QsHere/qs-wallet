<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>QS Wallet · Analytics</title>
</head>
<body>

  <header class="topbar">
    <span class="page-title">Analytics</span>
  </header>

  <main class="analytics-page">
    <div class="pill-row" id="rangePills" style="justify-content:center; margin-bottom:10px;">
      <button type="button" class="pill selected" data-range="week">This week</button>
      <button type="button" class="pill" data-range="month">This month</button>
      <button type="button" class="pill" data-range="last7">Last 7 days</button>
      <button type="button" class="pill" data-range="last30">Last 30 days</button>
      <button type="button" class="pill" data-range="custom">Custom…</button>
    </div>

    <div class="date-input-wrap hidden" id="customRangeWrap" style="max-width:280px; margin:0 auto 20px;">
      <div style="display:flex; gap:8px;">
        <input type="date" class="date-input" id="rangeStart" />
        <input type="date" class="date-input" id="rangeEnd" />
      </div>
    </div>

    <p class="breadcrumb" id="breadcrumb"></p>

    <p class="analytics-total" id="totalAmount">RM —</p>
    <p class="analytics-total-label" id="totalLabel">Total spent</p>

    <div class="chart-wrap">
      <canvas id="pieChart" width="260" height="260"></canvas>
    </div>

    <ul class="legend-list" id="legendList"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="analytics.js"></script>

  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <a href="index.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Home</span>
      </a>
      <a href="history.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>History</span>
      </a>
      <a href="analytics.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Analytics</span>
      </a>
      <a href="debts.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h13M7 8l4-4M7 8l4 4"/><path d="M17 16H4M17 16l-4-4M17 16l4 4"/></svg>
        <span>Debts</span>
      </a>
      <a href="settings.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Categories</span>
      </a>
    </nav>
  </div>
</body>
</html>
