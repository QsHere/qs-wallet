<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>QS Wallet · Analytics</title>
</head>
<body>

  <main class="analytics-page">
    <a href="index.html" class="nav-back-inline">‹ Home</a>
    <h1 class="page-heading">Analytics</h1>

    <div class="pill-row pill-row-nowrap" id="rangePills">
      <button type="button" class="pill" data-range="week">This week</button>
      <button type="button" class="pill" data-range="month">This month</button>
      <button type="button" class="pill" data-range="custom">Custom…</button>
    </div>

    <div class="date-input-wrap hidden" id="customRangeWrap" style="max-width:280px; margin:0 auto 20px;">
      <div style="display:flex; gap:8px;">
        <input type="date" class="date-input" id="rangeStart" />
        <input type="date" class="date-input" id="rangeEnd" />
      </div>
    </div>

    <p class="breadcrumb" id="breadcrumb"></p>

    <p class="analytics-total" id="totalAmount">RM —</p>
    <p class="analytics-total-label" id="totalLabel">Total spent</p>

    <div class="chart-wrap">
      <canvas id="pieChart" width="260" height="260"></canvas>
    </div>

    <ul class="legend-list" id="legendList"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="analytics.js"></script>
</body>
</html>
