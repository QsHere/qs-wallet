<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
<title>QS Wallet · Debts</title>
</head>
<body>

  <main class="debts-page">
    <h1 class="page-heading">Debts</h1>

    <div class="debt-net">
      <p class="debt-net-number" id="netNumber">RM —</p>
      <p class="debt-net-label" id="netLabel">Net position</p>
    </div>

    <h2 class="section-title">Owed to you</h2>
    <ul class="grouped-list" id="owedList"></ul>

    <h2 class="section-title">You owe</h2>
    <ul class="grouped-list" id="oweList"></ul>
  </main>

  <button class="fab" id="openAddDebt" title="Add debt">+</button>

  <!-- ADD DEBT SHEET -->
  <div class="sheet-overlay" id="addDebtOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span>New debt</span>
        <button class="sheet-close" id="addDebtClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="direction-toggle">
          <button type="button" class="pill selected" data-direction="owed_to_me">Owed to me</button>
          <button type="button" class="pill" data-direction="i_owe">I owe</button>
        </div>

        <label class="field-label">Person</label>
        <input type="text" id="debtPerson" class="text-input" placeholder="e.g. Father, Ah Meng" />

        <div class="amount-row">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="debtAmount" placeholder="0.00" />
        </div>

        <label class="field-label">Note (optional)</label>
        <input type="text" id="debtNote" class="text-input" placeholder="What's this for?" />

        <button class="btn-confirm" id="confirmAddDebt">Add</button>
      </div>
    </div>
  </div>

  <!-- DEBT ACTION SHEET (tap a row) -->
  <div class="sheet-overlay" id="debtActionOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span id="debtActionTitle">Person</span>
        <button class="sheet-close" id="debtActionClose">Close</button>
      </div>
      <div class="sheet-body">
        <p class="amount-context" id="debtActionBalance"></p>
        <button class="btn-confirm" id="openRecordPayment">Record a payment</button>
        <button class="btn-secondary" id="openIncreaseDebt" style="color:var(--blue); background:var(--bg-elevated-2);">Add more to this debt</button>
        <button class="btn-secondary" id="deleteDebt">Delete this debt</button>
      </div>
    </div>
  </div>

  <!-- INCREASE DEBT SHEET -->
  <div class="sheet-overlay" id="increaseOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span id="increaseTitle">Add more owed</span>
        <button class="sheet-close" id="increaseClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="amount-row">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="increaseAmount" placeholder="0.00" />
        </div>
        <p class="hero-caption" id="increaseHint" style="text-align:left; margin-top:0;"></p>
        <button class="btn-confirm" id="confirmIncrease">Add to balance</button>
      </div>
    </div>
  </div>

  <!-- RECORD PAYMENT SHEET -->
  <div class="sheet-overlay" id="paymentOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span></span>
        <span id="paymentTitle">Record payment</span>
        <button class="sheet-close" id="paymentClose">Close</button>
      </div>
      <div class="sheet-body">
        <div class="amount-row">
          <span class="amount-currency">RM</span>
          <input type="number" inputmode="decimal" class="amount-input" id="paymentAmount" placeholder="0.00" />
        </div>

        <label class="field-label" id="paymentAccountLabel">Account</label>
        <div class="pill-row" id="paymentAccountPills"></div>

        <label class="field-label">Date</label>
        <div class="pill-row" id="paymentDatePills">
          <button type="button" class="pill" data-date="today">Today</button>
          <button type="button" class="pill" data-date="yesterday">Yesterday</button>
          <button type="button" class="pill" data-date="other">Other…</button>
        </div>
        <div class="date-input-wrap hidden" id="paymentDateWrap">
          <input type="date" class="date-input" id="paymentDate" />
        </div>

        <button class="btn-confirm" id="confirmPayment">Confirm payment</button>
      </div>
    </div>
  </div>

  <script type="module" src="debts.js"></script>

  <div class="tab-bar-wrap">
    <nav class="tab-bar">
      <a href="index.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>Home</span>
      </a>
      <a href="history.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>History</span>
      </a>
      <a href="analytics.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        <span>Analytics</span>
      </a>
      <a href="debts.html" class="tab-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h13M7 8l4-4M7 8l4 4"/><path d="M17 16H4M17 16l-4-4M17 16l4 4"/></svg>
        <span>Debts</span>
      </a>
      <a href="settings.html" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Categories</span>
      </a>
    </nav>
  </div>
</body>
</html>
