<meta charset="UTF-8" />

<body>

  <main class="settings-page">
    <h1 class="page-heading">Settings</h1>

    <h2 class="section-title">Daily reminder</h2>
    <ul class="grouped-list" id="reminderList">
      <li>
        <span class="row-title">Remind me to log expenses</span>
        <label class="switch">
          <input type="checkbox" id="reminderToggle" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </li>
      <li class="hidden" id="reminderTimeRow">
        <span class="row-title">Time</span>
        <input type="time" id="reminderTime" class="date-input" style="width:auto;" value="20:00" />
      </li>
    </ul>
    <p class="hero-caption" id="reminderNote" style="text-align:left; margin:0 4px 26px;"></p>

    <h2 class="section-title">General</h2>
    <ul class="grouped-list">
      <li class="tappable" id="goCategories">
        <span class="row-left">
          <span class="tile-mini" style="background:#FF9F0A33">🏷️</span>&nbsp;
          <span class="row-title">Categories</span>
        </span>
        <span class="row-meta">›</span>
      </li>
    </ul>
  </main>

  <script type="module" src="settings.js"></script>
